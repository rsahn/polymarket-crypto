[pytest]
# Exclusion des artefacts gelés (snapshots historiques de provenance)
# Ces répertoires contiennent des copies figées du code à des fins d'audit
# et ne constituent pas le code source actif de production.
norecursedirs =
    analysis/d51/prepared_*
    analysis/d51/smoke_*
    analysis/d6/real_execution_calibration_v1/evidence/provisioning_review_*
    analysis/d6/real_execution_calibration_v1/frozen_*
    analysis/d6/vendor
    **/frozen_code_and_protocol
    **/__pycache__
    .git

# Tests actifs à découvrir
testpaths = analysis backend/tests
pythonpath = . backend backend/tests analysis
python_files = test_*.py
python_classes = Test*
python_functions = test_*
